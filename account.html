<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tài khoản | Pinky Beauty</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/shop-flow.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <header class="flow-header">
      <a href="index.html"
        ><img src="assets/images/pinky-logo.svg" alt="Pinky Beauty" /></a
      ><a href="product.html">Tiếp tục mua sắm</a>
    </header>
    <main class="flow-main">
      <div class="flow-breadcrumb">
        <a href="index.html">Trang chủ</a> / Tài khoản
      </div>
      <section class="auth-layout">
        <div class="auth-aside">
          <span>PINKY BEAUTY</span>
          <h1>Vẻ đẹp của bạn,<br />theo cách riêng.</h1>
          <p>Chào mừng bạn đến với tài khoản Pinky Beauty.</p>
          <i class="fa-solid fa-heart"></i>
        </div>
        <section class="auth-card account-view">
          <div class="account-icon"><i class="fa-solid fa-user-check"></i></div>
          <h2>Xin chào, khách hàng!</h2>
          <p class="form-intro">Bạn đã vào tài khoản Pinky Beauty.</p>
          <a class="primary-button button-link" href="cart.html"
            >Đi đến giỏ hàng</a
          ><a class="secondary-button logout-link" href="login.html"
            >Đăng xuất</a
          >
        </section>
      </section>
    </main>
  </body>
</html>
