<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng ký | Pinky Beauty</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/shop-flow.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head>
<body>
<header class="flow-header"><a href="index.html"><img src="assets/images/pinky-logo.svg" alt="Pinky Beauty"></a><a href="product.html">Tiếp tục mua sắm</a></header>
<main class="flow-main"><div class="flow-breadcrumb"><a href="index.html">Trang chủ</a> / Đăng ký</div>
